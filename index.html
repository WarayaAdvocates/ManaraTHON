<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="https://wxyzofficial.sirv.com/WARAYA/Manaragat2026.png">
  <title>ManaraTHON 2026 · Thank You</title>
  <!-- Google Fonts (Poppins for general, Outfit for bold impact) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      /* Gradient background matching the image: white/light blue top-left to deep blue bottom-right */
      background: radial-gradient(circle at 10% 20%, #ffffff 0%, #e0f2fe 40%, #bae6fd 70%, #38bdf8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Subtle decorative abstract shapes */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0));
      pointer-events: none;
      z-index: 0;
    }
    .shape1 { width: 600px; height: 600px; top: -200px; left: -200px; }
    .shape2 { width: 800px; height: 800px; bottom: -300px; right: -300px; }
    
    .content-container {
      z-index: 1;
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Main Event Logo */
    .event-main-logo {
      margin-bottom: 2rem;
      text-align: center;
    }
    
    .event-main-logo img {
      width: 100%;
      max-width: 450px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));
      transition: transform 0.3s ease;
    }

    .event-main-logo img:hover {
      transform: scale(1.02);
    }

    /* Logos Section */
    .logo-partners {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.6);
      padding: 1rem 2rem;
      border-radius: 60px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .logo-partners img {
      height: 60px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
      transition: transform 0.2s;
    }

    .logo-partners img:hover {
      transform: scale(1.05);
    }

    /* Text Styling matching the image */
    .text-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.1;
      margin-bottom: 2rem;
    }

    .pre-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: #1e40af; /* Deep Blue */
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .main-title-1 {
      font-family: 'Outfit', sans-serif;
      font-size: 6rem;
      font-weight: 900;
      color: #0284c7; /* Vibrant Blue */
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: -2px;
      line-height: 0.9;
    }

    .main-title-2 {
      font-family: 'Outfit', sans-serif;
      font-size: 7rem;
      font-weight: 900;
      color: #1d4ed8; /* Royal Blue */
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: -2px;
      line-height: 0.9;
      margin-top: -10px;
    }

    /* Buttons Container */
    .action-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
      width: 100%;
    }

    /* "See you again next year!" message */
    .next-year-msg {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: #0f172a; /* Dark slate for contrast */
      background: rgba(255, 255, 255, 0.8);
      padding: 1rem 2.5rem;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.9);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .next-year-msg i {
      color: #0284c7;
      font-size: 1.8rem;
    }

    /* Race Results Button */
    .results-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(95deg, #0e7490, #06b6d4);
      color: white;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 1rem 2.5rem;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
      border: 2px solid transparent;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .results-btn i {
      font-size: 1.3rem;
    }

    .results-btn:hover {
      background: linear-gradient(95deg, #0a5c72, #0891b2);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 25px rgba(6, 182, 212, 0.4);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .results-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .event-main-logo img { max-width: 300px; }
      .pre-title { font-size: 1.2rem; }
      .main-title-1 { font-size: 4rem; }
      .main-title-2 { font-size: 4.5rem; }
      .next-year-msg { font-size: 1.1rem; padding: 0.8rem 1.5rem; text-align: center; }
      .results-btn { font-size: 1rem; padding: 0.8rem 1.8rem; }
      .logo-partners { gap: 1rem; padding: 1rem; border-radius: 30px; }
      .logo-partners img { height: 40px; }
      .bg-shape { display: none; }
    }

    @media (max-width: 480px) {
      .event-main-logo img { max-width: 220px; }
      .pre-title { font-size: 1rem; }
      .main-title-1 { font-size: 3rem; letter-spacing: -1px; }
      .main-title-2 { font-size: 3.5rem; letter-spacing: -1px; }
      .next-year-msg { font-size: 0.95rem; flex-direction: column; gap: 5px; }
      .results-btn { font-size: 0.9rem; padding: 0.7rem 1.5rem; width: 100%; max-width: 280px; }
      .logo-partners img { height: 30px; }
    }
  </style>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <!-- Decorative Background Shapes -->
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>

  <div class="content-container">
    
    <!-- Main Event Logo -->
    <div class="event-main-logo">
      <img src="https://wxyzofficial.sirv.com/MANARAGAT%20FESTIVAL/ManaraTHON2026.png" alt="ManaraTHON 2026 Logo">
    </div>

    <!-- Logos Section -->
    <div class="logo-partners">
      <img src="https://wxyzofficial.sirv.com/WARAYA/Manaragat2026.png" alt="Manaragat Festival 2026">
      <img src="https://wxyzofficial.sirv.com/MANARAGAT%20FESTIVAL/Catbalogan_City_Seal.png" alt="Catbalogan City Seal">
      <img src="https://wxyzofficial.sirv.com/MANARAGAT%20FESTIVAL/CAPTIVATING%20Catbalogan.png" alt="Captivating Catbalogan">
      <img src="https://wxyzofficial.sirv.com/WARAYA/logo.png" alt="WARAYA Logo">
    </div>

    <!-- Main Text based on the image -->
    <div class="text-block">
      <div class="pre-title">With a Grateful Heart,</div>
      <div class="main-title-1">Damo</div>
      <div class="main-title-2">Nga Salamat!</div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <!-- Additional Message -->
      <div class="next-year-msg">
        <i class="fas fa-running"></i>
        See you again next year!
        <i class="fas fa-heart" style="color: #ef4444;"></i>
      </div>

      <!-- Race Results Button -->
      <a href="https://tinyurl.com/Manarathon26Results" target="_blank" class="results-btn">
        <i class="fas fa-trophy"></i> View Race Results
        <i class="fas fa-arrow-right"></i>
      </a>
    </div>

  </div>

</body>
</html>
